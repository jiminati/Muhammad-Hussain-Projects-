name: Build VLK Battery Doctor APK

on:
  push:
    paths:
      - 'vlk-battery-doctor/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The runner image already ships the SDK. Without this the action
          # tries to install the long-obsolete "tools" package and fails.
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the debug APK
        working-directory: vlk-battery-doctor
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename the APK
        working-directory: vlk-battery-doctor
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/VLK-Battery-Doctor-${GITHUB_RUN_NUMBER}.apk"
          ls -la out/

      - name: Publish the APK
        uses: actions/upload-artifact@v4
        with:
          name: VLK-Battery-Doctor-APK
          path: vlk-battery-doctor/out/*.apk
          retention-days: 90
          if-no-files-found: error
